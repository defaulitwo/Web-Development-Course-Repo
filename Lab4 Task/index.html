<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-box">
        <h2>Todo App</h2>
        <div class="task-input-box">
            <input placeholder="What needs doing?" id="input_textbox">
            <button id="input_button"><b>Add</button>
        </div>
        <div class="filter-box">
            <button id="filter_all"><b>All</button>
            <button id="filter_active"><b>Active</button>
            <button id="filter_completed"><b>Completed</button>
        </div>
        <div class="task-view" id="task_view">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
